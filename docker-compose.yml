services:
  db:
    build: ./database
    image: akaer-db
    # MySQL 8.4 desativa o mysql_native_password por padrão; reativamos aqui.
    command: --mysql-native-password=ON
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: janosys_db
      MYSQL_ROOT_HOST: "%"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-ppassword", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    image: akaer-backend
    environment:
      DATABASE_URL: "mysql://root:password@db:3306/janosys_db"
      PORT: "3001"
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  rag:
    build: ./RAG
    image: akaer-rag
    environment:
      HF_TOKEN: "${HF_TOKEN:-}"
      DOCS_PATH: "/app/documentos"
      RAG_CORS_ORIGINS: "${RAG_CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}"
    volumes:
      - ${RAG_CHROMA_PATH:-./RAG/chroma_data}:/app/chroma_data
      - ${RAG_DOCS_PATH:-./RAG/documentos}:/app/documentos:ro
    ports:
      - "${RAG_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: akaer-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_started
      rag:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
