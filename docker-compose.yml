services:
  frontend:
    build: ./frontend
    image: akaer-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - db
    restart: unless-stopped

  # backend ainda não implementado nesta etapa do refactor.
  # Ao reconstruir a API, descomente este serviço (ver backend/README.md).
  # backend:
  #   build: ./backend
  #   image: akaer-backend
  #   ports:
  #     - "${BACKEND_PORT:-3001}:3001"
  #   environment:
  #     DB_HOST: db
  #     DB_PORT: 3306
  #     DB_NAME: ${MYSQL_DATABASE}
  #     DB_USER: ${MYSQL_USER}
  #     DB_PASSWORD: ${MYSQL_PASSWORD}
  #   depends_on:
  #     - db
  #   restart: unless-stopped

  db:
    build: ./database
    image: akaer-db
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  db_data:
